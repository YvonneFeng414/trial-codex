[project]
name = "trial-codex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openai>=3.37.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["qc-pipeline"]
testpaths = ["qc-pipeline/tests"]

# Absence search terms per SAP field (and per heading for prose sections).
# Written before any QC output was inspected (implementation_plan.md 4.10). Frozen with the
# triggers at the end of P2; any later change bumps `version` and is reported with results.
#
# Matching: case-insensitive, on word boundaries, against page text with margin line
# numbers removed. A term starting with "re:" is a case-sensitive regular expression
# (prefix (?i) to ignore case), so acronyms such as SAS or PASS do not match prose.
# Lookup: a fact's field list if one exists, otherwise its heading's list.

